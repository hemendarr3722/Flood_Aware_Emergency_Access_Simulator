services:
  db:
    image: pgrouting/pgrouting:latest
    container_name: flood_aware_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: flood_aware
      POSTGRES_USER: flood_user
      POSTGRES_PASSWORD: flood_local_dev_only
    ports:
      - "15432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood_user -d flood_aware"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: flood_aware_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://flood_user:flood_local_dev_only@db:5432/flood_aware
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: flood_aware_ui
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgis_data:
